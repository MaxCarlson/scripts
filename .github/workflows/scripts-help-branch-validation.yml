name: scripts-help branch validation

on:
  push:
    branches:
      - agent/scripts-help-tui-browser
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -e modules/scripts_help pytest ruff

      - name: Compile
        run: python -m compileall -q modules/scripts_help/scripts_help help.py pyscripts/help.py

      - name: Ruff correctness checks
        run: ruff check --select E9,F modules/scripts_help/scripts_help modules/scripts_help/tests help.py pyscripts/help.py

      - name: Tests
        run: python -m pytest modules/scripts_help/tests -q -o addopts=""

      - name: Root launcher help smoke test
        run: python help.py --help
