[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ytaedl"
version = "2.12.0"
# Version history (MAJOR.MINOR.PATCH per MODULE_STANDARDS.md):
# 2.12.0 — MINOR: move URL-file lock sidecars to <archive>/locks with canonical full-path hashes so same-named files in different directories cannot collide
# 2.11.0 — MINOR: exact -p/--priority-files workload mode (-i/--priority-files-only) with one worker per file; worker-owned cross-process URL-file locks and visible lock-wait status; fix cleanup index archive-dir initialization
# 2.10.1 — PATCH: STARS_DIR/AESTARS_DIR env vars used as defaults for -s/-d across all subcommands (manager, validate, status, cleanup index, urls); -j/--json-plan default fixed to literal path (was None, showing confusing double-default in help)
# 2.10.0 — MINOR: compact 2-line worker UI (8 workers + header visible on one screen); simulate timeout → UNKNOWN_STATUS for yt-dlp downloaded entries (genuine failure still BAD_STATUS); set last_transition/tool/url in worker view
# 2.9.1 — PATCH: archive status: deduplicate archive by URL (best status wins, collapse retry lines); domain index total = queued+inprog+finished (not total_urls which is queued-only after load); AEBN/yt-dlp split scans all known URL sets
# 2.9.0 — MINOR: archive status -s/--stars-dir -d/--aebn-dir URL file coverage (total, never-attempted, per-file remaining); clearer domain index output (Done/Remaining labels)
# 2.8.0 — MINOR: archive status subcommand (fast no-network count table); worker file pool interleaving (each worker owns one file, alternating ae/yt); aebndl test cwd=temp keeps log files out of workspace
# 2.7.3 — PATCH: repair plan always written; defaults to validator_logs/archive_repair_plan.json; apply-plan -p defaults to same path
# 2.7.2 — MINOR: -r/--sample PCT random-sampling mode with extrapolated totals in summary; % shown in all summary columns for both sampled and full runs
# 2.7.1 — PATCH: validator_logs/ default to ./validator_logs (CWD); y/n/c prompt before overwriting old logs; human-readable per-worker logs (worker-NN.log) with file-transition headers and verdict columns; run header/footer in all logs
# 2.7.0 — MINOR: archive validate -F/--fast filesystem-only check; auto-active for "already" entries; ArchiveUrl.archive_size_mib; _check_dir_has_video; AEBN "done but missing" → GOOD_STATUS re-queue
# 2.6.1 — PATCH: replace proc.terminate() with _kill_process_tree() in all shutdown paths (finally block, requeue, throttle/unthrottle); prevents orphaned aebndl/yt-dlp/ffmpeg children on exit
# 2.6.0 — MINOR: auto-resolve AEBN scene ordinal from URL fragment (#scene-XXXXXXXX) via aebn_dl page scrape; pass -s N to aebndl so scene URLs download only the scene
# 2.5.0 — MINOR: mux stall detection is now liveness-based (heartbeat resets timer, no hard wall-clock cap); complete_stall_seconds now means inactivity window (default 120s)
# 2.4.0 — MINOR: archive validate uses real yt-dlp download test for stalled/bad yt-dlp entries (shared _build_ytdlp_cmd); domain_index.json moved to archive folder with auto-migration
# 2.3.0 — MINOR: archive validate runs real aebndl download test for stalled/bad AEBN entries; fix _build_aebndl_cmd max_height=0 for lowest quality
# 2.2.0 — MINOR: add -f/--complete-stall-seconds to manager (default 1800s) to prevent mux-phase kills on large files
# 2.1.1 — PATCH: fix stall-detector killing aebndl during concat/mux via segments_complete event
# 2.1.0 — MINOR: add archive validation/apply-plan workflow and remove run finished-log override
# 2.0.5 — PATCH: fix finish event rejected after extdl fallbacks update active_attempt_id
# 2.0.4 — PATCH: keep ytaedl pytest temp roots module-local
# 2.0.3 — PATCH: reject short fallback preview variants and clean completed .mp4.temp artifacts
# 2.0.2 — PATCH: add attempt-id progress protection, help version text, and log audit helper
# 2.0.1 — PATCH: harden run profiles, multi-root duplicate checks, temp tests, and stale-progress clearing
# 2.0.0 — MAJOR: entry points changed (ytaedl → ytaedl.cli:main; ytaedl-download removed)
# 1.12.1 — prior scheme, pre-standards
description = "Batch downloader using yt-dlp/aebn with an optional orchestrator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "yt-dlp>=2024.10.22",
  "procparsers",
]

[project.optional-dependencies]
ui = ["termdash>=0.5.0"]
windows = ["psutil>=5.9.0"]

[project.scripts]
ytaedl = "ytaedl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ytaedl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
norecursedirs = [
  ".*",
  "__pycache__",
  ".pytest_cache",
  ".pytest_tmp_root",
  "ytaedl_test_tmp*",
]
tmp_path_retention_policy = "failed"

