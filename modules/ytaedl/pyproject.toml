[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ytaedl"
version = "2.0.1"
# Version history (MAJOR.MINOR.PATCH per MODULE_STANDARDS.md):
# 2.0.1 — PATCH: harden run profiles, multi-root duplicate checks, temp tests, and stale-progress clearing
# 2.0.0 — MAJOR: entry points changed (ytaedl → ytaedl.cli:main; ytaedl-download removed)
# 1.12.1 — prior scheme, pre-standards
description = "Batch downloader using yt-dlp/aebn with an optional orchestrator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "yt-dlp>=2024.10.22",
  "procparsers",
]

[project.optional-dependencies]
ui = ["termdash>=0.5.0"]
windows = ["psutil>=5.9.0"]

[project.scripts]
ytaedl = "ytaedl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ytaedl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
norecursedirs = [
  ".*",
  "__pycache__",
  ".pytest_cache",
  ".pytest_tmp_root",
  "codex_tmp_test",
  "ytaedl_test_tmp*",
]
tmp_path_retention_policy = "failed"

