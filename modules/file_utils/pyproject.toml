[build-system]
requires = [ "setuptools>=64",]
build-backend = "setuptools.build_meta"

[project]
name = "file_utils"
version = "1.6.0"
description = "A Python library for advanced file manipulation and management, including an interactive lister."
requires-python = ">=3.9"
dependencies = [
    "mxc-platform-utils>=0.9.0,<0.10",
    "mxc-termdash>=0.10.0,<0.11",
    "windows-curses; sys_platform == 'win32'"
]

[[project.authors]]
name = "Your Name"
email = "carlsonamax@gmail.com"

[project.scripts]
"file-util" = "file_utils.cli:main"
"fu" = "file_utils.cli:main"
"fsu" = "file_utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["file_utils*"]

[tool.pytest.ini_options]
addopts = "-v --basetemp=.pytest_tmp"
testpaths = ["tests"]
tmp_path_retention_policy = "none"
