[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compresser"
version = "0.23.0"
description = "Reusable image compression, analysis, and perceptual optimization module for manga and manhwa."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scripts Project Authors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics",
  "Operating System :: OS Independent",
]

dependencies = [
  "pillow>=10.0",
  "numpy>=1.20",
  "termdash>=0.7.0",
  "cross_platform>=0.7.0",
]

[project.scripts]
compresser = "compresser.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
