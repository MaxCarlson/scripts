[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-coordinator"
version = "0.1.0"
description = "General-purpose event-driven resource coordination framework, process supervisor, and LM Studio proxy gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max" }]
dependencies = [
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
resource-coordinator = "resource_coordinator.cli:main"
gpu-coordinator = "resource_coordinator.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["resource_coordinator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=modules/resource_coordinator/.pytest_tmp_root"
asyncio_mode = "auto"
