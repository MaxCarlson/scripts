[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-abilities"
version = "0.3.0"
description = "Universal resource manager for AI coding agents -- manages agents, prompts, instructions, skills, hooks, and collections"
authors = [{name = "mcarls"}]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
abilities = "agent_abilities.cli:main"
agent-abilities = "agent_abilities.cli:main"

[tool.setuptools]
packages = ["agent_abilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
