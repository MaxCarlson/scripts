[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scripts_help"
version = "2.0.1"
# Version history (MAJOR.MINOR.PATCH per MODULE_STANDARDS.md):
# 0.1.0 — initial release: interactive help browser, version-staleness checks
# 0.2.0 — added: AI drift-update offer in cli + post-install hook; glow/README viewer in program info
# 0.3.0 — subcommands (browse/drift/sync); README version tracking; pyscripts/readme/ convention
# 0.4.0 — ignore patch-only README drift; summarize actionable help update counts
# 0.5.0 — structure-first TUI, live search/args, README/Git/files viewers, root launcher
# 2.0.0 — curated ag default, readable help descriptions, full inventory and definition views
# 2.0.1 — restore module command summaries for manifest-backed ag entries
description = "Interactive help browser for the scripts repository."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scripts-help = "scripts_help.cli:main"
ag = "scripts_help.ag:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts_help"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["*_test.py"]
norecursedirs = [".*", "__pycache__", ".pytest_tmp_root"]
tmp_path_retention_policy = "failed"
