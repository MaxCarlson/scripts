[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-metrics"
version = "0.1.0"
description = "Small cross-platform CPU, memory, process, I/O, and GPU measurements"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["resource_metrics*"]
