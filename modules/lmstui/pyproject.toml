[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstui"
version = "1.0.0"
description = "Fast, dependency-free CLI for LM Studio with streaming, model auto-selection, and defaults persistence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lmst = "lmstui.cli:main_lmst"
lmstui = "lmstui.cli:main_lmstui"
lmc = "lmstui.cli:main_lmc"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["lmstui*"]

[tool.setuptools.package-data]
lmstui = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=modules/lmstui/.pytest_tmp_root"
