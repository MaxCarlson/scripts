[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networks"
version = "0.4.0"
description = "Cross-platform networking utilities with WSL2 support, local web access, and browser automation"
authors = [{name = "mcarls"}]
requires-python = ">=3.9"
dependencies = [
    "mxc-platform-utils>=0.9.0,<0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
screenshot = [
    "playwright>=1.40.0",
]

[project.scripts]
networks = "networks.cli:main"
netinfo = "networks.cli:main"
local-web = "networks.cli:main"

[tool.setuptools]
packages = ["networks"]
