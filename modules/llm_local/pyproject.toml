[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-local"
version = "0.1.0"
description = "Minimal local LLM inference client for LM Studio (localhost:1234/v1) — stdlib only, graceful offline fallback"
authors = [{name = "mcarls"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["llm_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
