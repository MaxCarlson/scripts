[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli_tui"
version = "0.1.0"
description = "Reusable argparse-to-termdash TUI engine with real-time streaming process runner and side-by-side image viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scripts Project Authors" }]

dependencies = [
  "termdash>=0.8.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
