[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procwatch"
version = "0.4.1"
description = "Windows 11 live console/terminal popup guard, process catcher, and causal diagnostic CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maxwell Carlson", email = "carlsonamax@gmail.com" }]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
procwatch = "procwatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["procwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "-q"
