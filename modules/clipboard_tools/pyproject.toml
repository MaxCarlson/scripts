[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard_tools"
version = "1.0.0"
description = "Clipboard command suite with multi-buffer support and tmux/Windows bridge."
authors = [
    {name = "Scripts Repo"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
c2c = "clipboard_tools.entrypoints:copy_main"
c2cd = "clipboard_tools.entrypoints:copy_default_main"
c2cr = "clipboard_tools.entrypoints:copy_recursive_main"
c2ca = "clipboard_tools.entrypoints:copy_append_main"
pclip = "clipboard_tools.entrypoints:print_clipboard_main"
gcb = "clipboard_tools.entrypoints:get_clipboard_short_main"
scb = "clipboard_tools.entrypoints:set_clipboard_short_main"
rwc = "clipboard_tools.entrypoints:replace_with_clipboard_main"
sfcb = "clipboard_tools.entrypoints:replace_with_clipboard_main"
rwcp = "clipboard_tools.entrypoints:replace_with_clipboard_from_last_main"
cld = "clipboard_tools.entrypoints:clipboard_diff_main"
apc = "clipboard_tools.entrypoints:append_clipboard_main"
crx = "clipboard_tools.entrypoints:clipboard_replace_main"
cb2c = "clipboard_tools.entrypoints:copy_buffer_main"
cb2cf = "clipboard_tools.entrypoints:copy_buffer_full_main"
otc = "clipboard_tools.entrypoints:output_to_clipboard_main"
otcw = "clipboard_tools.entrypoints:output_to_clipboard_wrap_main"
otca = "clipboard_tools.entrypoints:output_to_clipboard_append_main"
otcwa = "clipboard_tools.entrypoints:output_to_clipboard_wrap_append_main"
tmux2winclip = "clipboard_tools.tmux_bridge:cli_main"
tmuxcp = "clipboard_tools.tmux_bridge:cli_main"

[tool.scripts_help.descriptions]
c2c = "Copy selected file or path contents to the clipboard."
c2cd = "Copy selected file or path contents using the default mode."
c2cr = "Recursively copy matching file contents to the clipboard."
c2ca = "Append selected file or path contents to the clipboard."
pclip = "Print the current clipboard contents."
gcb = "Copy the clipboard's short text value to standard output."
scb = "Set clipboard text from standard input or arguments."
rwc = "Replace the current selection with clipboard contents."
sfcb = "Replace the current selection with clipboard contents."
rwcp = "Replace the selection with the most recently copied clipboard value."
cld = "Show a diff between clipboard buffers or recent clipboard values."
apc = "Append standard input or text to the clipboard."
crx = "Replace text using clipboard contents and configured rules."
cb2c = "Copy a named clipboard buffer to the system clipboard."
cb2cf = "Copy a full clipboard buffer, including metadata, to the system clipboard."
otc = "Copy command output to the clipboard."
otcw = "Wrap command output before copying it to the clipboard."
otca = "Append command output to the current clipboard contents."
otcwa = "Wrap command output and append it to the clipboard."
tmux2winclip = "Bridge tmux clipboard data to the Windows clipboard."
tmuxcp = "Copy tmux selection text to the Windows clipboard."

[tool.setuptools]
packages = ["clipboard_tools"]

[tool.setuptools.package-dir]
clipboard_tools = "."
