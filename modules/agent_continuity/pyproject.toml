[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-continuity"
version = "2.3.0"
description = "Local-first GUI-agent session continuity registry for ChatGPT GUI workflows, Codex CLI, Antigravity CLI, and Claude Code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maxwell Carlson", email = "carlsonamax@gmail.com" }]
dependencies = ["terminal-launcher>=0.1.1,<0.3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
agents = "agent_continuity.cli:main"
llmd = "agent_continuity.dispatcher_cli:main"
llm-dispatcher = "agent_continuity.dispatcher_cli:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_continuity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
pythonpath = [".."]
addopts = "-q --basetemp=.pytest_tmp_root/pytest"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
