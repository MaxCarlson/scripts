[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rrbackup"
version = "2.0.1"
description = "Unified cross-platform Restic backup management and viewer CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Max", email = "max@example.com" }]
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "termdash>=0.5.0",
    "tomli; python_version < '3.11'",
    "tomli-w",
    "windows-curses; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
backup = "rrbackup.application:main"

[tool.setuptools.packages.find]
# Discover packages from project root (flat layout)
include = ["rrbackup*"]
exclude = ["tests*"]
