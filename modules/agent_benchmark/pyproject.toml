[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-benchmark"
version = "0.2.0"
description = "Independent evaluation of coding workers through the existing OpenCode bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_benchmark*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
