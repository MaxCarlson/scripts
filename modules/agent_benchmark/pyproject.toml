[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-benchmark"
version = "1.12.1"
description = "Independent evaluation of coding workers through the existing OpenCode bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["benchmark-core>=0.1.1,<0.2", "script-logging>=0.1.0,<0.2", "mcp>=1.30,<2", "httpx>=0.28,<1", "psutil>=5.9", "termdash>=0.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_benchmark*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = [".", "../benchmark_core", "../termdash", "../interactive_reports"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = [".pytest_tmp_root"]

[project.scripts]
agent-bench = "agent_benchmark.cli:main"
agent-benchmark = "agent_benchmark.cli:main"
agent_benchmark = "agent_benchmark.cli:main"

[tool.setuptools.package-data]
agent_benchmark = ["tasks/**/*"]

[tool.setuptools.exclude-package-data]
agent_benchmark = ["**/__pycache__/*", "**/*.pyc"]
