[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadl"
version = "1.53.0"
description = "Concurrent, resumable manga and gallery download manager."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["compresser>=0.27.0", "cross_platform>=0.8.0", "gallery-dl>=1.32,<2", "hdporncomics", "kavita>=0.1.0", "Pillow>=10,<13", "termdash>=0.7.0", "websocket-client>=1.8,<2"]

[project.scripts]
mangadl = "mangadl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mangadl*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_policy = "none"
