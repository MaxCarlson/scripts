[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-lifecycle"
version = "0.1.0"
description = "Reusable Windows user-session scheduled task lifecycle management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
runtime-lifecycle = "runtime_lifecycle.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp_root"
testpaths = ["tests"]
python_files = ["*_test.py"]
