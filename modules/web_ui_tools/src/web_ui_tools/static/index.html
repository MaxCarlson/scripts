<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Web Tools</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="welcome">
      <div class="eyebrow">LOCAL APPLICATION</div>
      <h1>Local Web Tools</h1>
      <p>This page is served by the shared browser service. An application can mount its own API routes here.</p>
      <form id="login-form">
        <label for="login-code">Login code</label>
        <input id="login-code" type="password" autocomplete="current-password" required>
        <button type="submit">Unlock local view</button>
        <output id="login-error" aria-live="polite"></output>
      </form>
      <section id="app-result" hidden>
        <div class="eyebrow">APPLICATION ROUTE</div>
        <pre id="message"></pre>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
