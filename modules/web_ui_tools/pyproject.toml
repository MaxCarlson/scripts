[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "web-ui-tools"
version = "0.1.0"
description = "Small reusable local ASGI and static browser service for application-owned views."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "wsproto>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/web_ui_tools"]
include = ["src/web_ui_tools/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest_tmp_root"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
